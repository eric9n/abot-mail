name = "resend-agent-mail-relay"
main = "worker.js"
compatibility_date = "2026-09-01"

# Production is deployed only by Workers Builds running deploy/cloudflare.mjs.
# Live custom route. A deploy from this file must keep mail.abot.run attached.
# workers.dev stays off: POST /mcp trusts only the Service Binding host.
# Mail is not archived. There is no R2 bucket, ingest queue, Workers AI, or cron.
workers_dev = false
preview_urls = false
[[routes]]
pattern = "mail.abot.run/*"
zone_name = "abot.run"

# D1 still holds rate_limits for send_email and POST /mcp.
# Historical mail tables in this database are not read or dropped by the worker.
[[d1_databases]]
binding = "DB"
database_name = "abot-mail-archive"
database_id = "779058bf-f5c1-44de-b2c8-99350ec7748e"

# Secrets stay in `wrangler secret put` (WEBHOOK_SECRET, RESEND_API_KEY).
# POST /mcp does not read MCP_TOKEN or INTERNAL_TOKEN.
# Service Binding calls must send x-abot-owner-email.
# Never write secret values in this file.

# Workers Logs. One structured line per invocation; head sampling stays at 1.
[observability]
enabled = true
head_sampling_rate = 1

# One Analytics Engine point per invocation. Index is the low-cardinality stage.
[[analytics_engine_datasets]]
binding = "METRICS"
dataset = "mail_metrics"

[env.staging]
name = "resend-agent-mail-relay-staging"
# Do not inherit the production mail.abot.run route.
routes = []
workers_dev = true
# Separate worker and D1. Do not point this at the production database.
# Replace database_id after `npx wrangler d1 create abot-mail-archive-staging`.
# The placeholder is not the production database.

[[env.staging.d1_databases]]
binding = "DB"
database_name = "abot-mail-archive-staging"
database_id = "00000000-0000-4000-8000-000000000000"

[env.staging.observability]
enabled = true
head_sampling_rate = 1

[[env.staging.analytics_engine_datasets]]
binding = "METRICS"
dataset = "mail_metrics_staging"
